name: Latest blog posts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # Troque pelo seu RSS. Exemplos:
          # Medium: https://medium.com/feed/@SEU_USUARIO_MEDIUM
          # Dev.to: https://dev.to/feed/SEU_USUARIO_DEVTO
          feed_list: "https://medium.com/feed/@SEU_USUARIO_MEDIUM"
          max_post_count: 5
